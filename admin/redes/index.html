<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Para redes | Admin Bisontes DUX</title>
  <meta name="description" content="Panel interno de Bisontes DUX: archivos originales para publicar en redes." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#545454" />
  <link rel="icon" type="image/png" href="../../favicon.png" />
  <link rel="stylesheet" href="../partido/partido.css" />
  <style>
    .drop { display: block; padding: 22px 14px; border: 2px dashed #999; border-radius: 10px; background: #fff; text-align: center; font-weight: 700; cursor: pointer; }
    .drop.over { border-color: var(--grey); background: var(--pink); }
    .drop input { display: none; }
    .items { display: grid; gap: 12px; margin-top: 18px; }
    .item { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 10px; background: #fff; border: 1px solid var(--line); border-radius: 10px; }
    .item video, .item img { width: 96px; height: 170px; object-fit: cover; border-radius: 6px; background: #000; }
    .item h3 { margin: 0 0 4px; font-size: 15px; word-break: break-all; }
    .item .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .item textarea { min-height: 70px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 800; background: var(--pink); }
    .badge.programado { background: #ffe58a; } .badge.publicado { background: #bfe5c8; }
    .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 8px; }
    .bar i { display: block; height: 100%; width: 0; background: var(--grey); }
  </style>
</head>
<body>
  <header class="top">
    <a class="back" href="../">‹ Panel</a>
    <h1>Para redes</h1>
  </header>

  <section id="login" class="screen" hidden>
    <h2>Entrar</h2>
    <p class="muted">Con el mismo correo y contraseña que el panel de admin.</p>
    <form id="login-form">
      <label for="email">Correo</label>
      <input type="email" id="email" autocomplete="email" required />
      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="current-password" required />
      <button type="submit" class="primary big">Entrar</button>
      <p id="login-status" class="status" role="status"></p>
    </form>
  </section>

  <section id="main" class="screen" hidden>
    <p class="muted">Sube aquí el vídeo o la foto <strong>original</strong> (desde el ordenador o la galería del móvil, nunca reenviado por WhatsApp). Se guarda sin comprimir. Luego «Copiar enlace» y pégalo en Metricool → Añadir → <em>Desde URL</em>.</p>
    <form id="upload-form">
      <label class="drop" id="drop">📤 Toca para elegir o arrastra aquí vídeos y fotos
        <input type="file" id="files" accept="video/*,image/*" multiple />
      </label>
      <label for="caption">Copy / notas (opcional)</label>
      <textarea id="caption" rows="3"></textarea>
      <label for="publish_on">¿Cuándo publicarlo? (opcional)</label>
      <input type="datetime-local" id="publish_on" />
      <ul id="progress" class="muted"></ul>
      <p id="upload-status" class="status" role="status"></p>
    </form>
    <div id="items" class="items"></div>
  </section>

  <p id="toast" class="toast" role="status" aria-live="polite" hidden></p>

  <script src="../../js/bisontes-api.js"></script>
  <script src="../../js/galeria-config.js"></script>
  <script src="redes.js"></script>
</body>
</html>
