<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Partido en directo | Admin Bisontes DUX</title>
  <meta name="description" content="Panel interno de Bisontes DUX para el 11 inicial y el partido en directo." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#545454" />
  <link rel="icon" type="image/png" href="../../favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Las mismas letras que la web: las usa también la imagen de las historias. -->
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="partido.css" />
</head>
<body>
  <header class="top">
    <a class="back" href="../" aria-label="Volver al panel">‹ Panel</a>
    <h1 id="title">Partidos</h1>
    <span id="sync" class="sync" role="status" aria-live="polite"></span>
  </header>

  <!-- LOGIN -->
  <section id="login" class="screen" hidden>
    <h2>Entrar</h2>
    <p class="muted">Con el mismo correo y contraseña que el panel de admin.</p>
    <form id="login-form">
      <label for="email">Correo</label>
      <input type="email" id="email" autocomplete="email" required />
      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="current-password" required />
      <button type="submit" class="primary big">Entrar</button>
      <p id="login-status" class="status" role="status"></p>
    </form>
  </section>

  <!-- LISTA DE PARTIDOS -->
  <section id="list" class="screen" hidden>
    <button type="button" id="new-match" class="primary big">+ Nuevo partido</button>
    <div id="matches"></div>
  </section>

  <!-- UN PARTIDO -->
  <section id="match" class="screen" hidden>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="live" aria-selected="true">Directo</button>
      <button type="button" role="tab" data-tab="lineup" aria-selected="false">11 inicial</button>
      <button type="button" role="tab" data-tab="photos" aria-selected="false">Fotos</button>
      <button type="button" role="tab" data-tab="info" aria-selected="false">Datos</button>
    </nav>
    <div id="tab-live" class="tab"></div>
    <div id="tab-lineup" class="tab" hidden></div>
    <div id="tab-photos" class="tab" hidden></div>
    <div id="tab-info" class="tab" hidden></div>
  </section>

  <!-- HOJA INFERIOR (formularios de cada acción) -->
  <dialog id="sheet" class="sheet">
    <form method="dialog" id="sheet-form">
      <div id="sheet-body"></div>
    </form>
  </dialog>

  <p id="toast" class="toast" role="status" aria-live="polite" hidden></p>

  <script src="../../js/bisontes-api.js"></script>
  <script src="../../js/galeria-config.js"></script>
  <script src="historias.js"></script>
  <script src="partido.js"></script>
</body>
</html>
