# Los proyectos gratuitos de Supabase se pausan tras 7 días sin uso y la galería dejaría
# de cargar. Esta Action hace una consulta cada 3 días para mantenerlo activo; si falla,
# GitHub avisa por correo (señal de que la galería no responde).
name: Galería despierta

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar la galería
        run: |
          read -r URL KEY <<< "$(node -e "global.window = {}; require('./js/galeria-config.js'); const c = window.BISONTES_GALERIA; console.log(c.supabaseUrl || '-', c.supabaseKey || '-')")"
          if [ "$URL" = "-" ]; then
            echo "La galería todavía no está conectada a Supabase."
            exit 0
          fi
          curl -fsS -o /dev/null "$URL/rest/v1/gallery_photos?select=id&is_public=eq.true&limit=1" -H "apikey: $KEY"
          echo "Supabase responde."
